<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Touch Messenger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#f5f5f5;--bg2:#ffffff;--card:#fafafa;--card2:#f0f0f0;
            --border:#e0e0e0;--border2:#d0d0d0;--text:#1a1a1a;--text2:#666;--text3:#999;
            --accent:#7b1f2b;--accent2:#9e2d3a;--accent3:#5a1520;
            --font:'Ubuntu',sans-serif;--head:'Space Grotesk',sans-serif;
            --radius:12px;--radius-lg:16px;--transition:200ms ease;
        }
        body.dark{
            --bg:#141414;--bg2:#1a1a1a;--card:#202020;--card2:#252525;
            --border:#2a2a2a;--border2:#333;--text:#ececec;--text2:#a0a0a0;--text3:#7a7a7a;
        }
        body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
        button{cursor:pointer;border:none;background:none;color:inherit;font-family:var(--font);font-size:inherit;transition:all var(--transition)}
        button:active{transform:scale(0.96)}
        input,textarea{font-family:var(--font);background:none;border:none;color:var(--text);outline:none;font-size:15px}
        input::placeholder,textarea::placeholder{color:var(--text3)}
        ::-webkit-scrollbar{width:4px}
        ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

        .header{height:60px;background:var(--bg2);border-bottom:2px solid var(--accent);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100}
        .header-left{display:flex;align-items:center;gap:10px}
        .back-btn{display:none;width:34px;height:34px;border-radius:var(--radius);align-items:center;justify-content:center;color:var(--text2);font-size:18px}
        .back-btn:hover{background:var(--card2);color:var(--text)}
        .logo-text{font-family:var(--head);font-size:18px;font-weight:600}
        .header-right{display:flex;gap:4px}
        .hbtn{width:36px;height:36px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--text2)}
        .hbtn:hover{background:var(--card2);color:var(--text)}
        .ava-sm{width:32px;height:32px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:#fff}

        .app{display:flex;height:calc(100vh - 60px);position:relative;overflow:hidden}
        .chats-screen{width:380px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:1}
        .search-wrap{padding:12px;position:relative}
        .search-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;display:flex;align-items:center;gap:8px}
        .search-box input{flex:1;font-size:14px;background:transparent}
        .chats-list{flex:1;overflow-y:auto;padding:4px 8px}
        .chat-item{display:flex;align-items:center;padding:10px;border-radius:var(--radius-lg);cursor:pointer;margin-bottom:2px;gap:10px;transition:all var(--transition)}
        .chat-item:hover{background:var(--card)}
        .chat-item.active{background:var(--card);border-left:3px solid var(--accent)}
        .ava{width:44px;height:44px;border-radius:50%;background:var(--card2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;color:var(--text2);flex-shrink:0}
        .chat-info{flex:1;min-width:0}
        .chat-name{font-weight:500;font-size:14px}
        .chat-last{font-size:12px;color:var(--text2)}

        .chat-screen{flex:1;display:flex;flex-direction:column;background:var(--bg);z-index:2}
        .chat-header{height:60px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--bg2)}
        .chat-header-info{display:flex;align-items:center;gap:10px}
        .ava-lg{width:40px;height:40px;border-radius:50%;background:var(--card2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;color:var(--text2)}
        .chat-title{font-family:var(--head);font-size:15px;font-weight:600;cursor:pointer}
        .chat-title:hover{color:var(--accent)}
        .chat-status{font-size:11px;color:var(--text3)}
        .chat-actions{display:flex;gap:2px}

        .messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:3px}
        .messages-center{text-align:center;color:var(--text3);font-size:13px;margin-top:40px}
        .msg{display:flex;margin-bottom:2px}
        .msg.in{justify-content:flex-start}.msg.out{justify-content:flex-end}
        .msg-bubble{max-width:65%;padding:9px 13px;border-radius:var(--radius-lg);animation:popIn 0.25s ease}
        .msg.in .msg-bubble{background:var(--bg2);border:1px solid var(--border);border-bottom-left-radius:6px}
        .msg.out .msg-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:6px}
        .msg-bubble p{font-size:14px;line-height:1.4;margin-bottom:2px;word-wrap:break-word}
        .msg-bubble .time{font-size:10px;opacity:.6;text-align:right}
        @keyframes popIn{from{opacity:0;transform:scale(0.9) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .msg-date-separator{text-align:center;margin:12px 0 6px}
        .msg-date-separator span{background:var(--card);border:1px solid var(--border);color:var(--text2);font-size:10px;padding:3px 10px;border-radius:10px}

        .input-area{padding:10px 12px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:flex-end;gap:8px}
        .input-area textarea{flex:1;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:18px;font-size:14px;resize:none;min-height:38px;max-height:100px;line-height:1.4}
        .input-area textarea:focus{border-color:var(--accent)}
        .btn-send{width:40px;height:40px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
        .btn-send:hover{background:var(--accent2)}

        .fullscreen{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:300;flex-direction:column;animation:fadeIn 0.25s ease}
        .fullscreen.show{display:flex}
        .fs-header{height:200px;background:linear-gradient(135deg,var(--accent3),var(--accent));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative}
        .fs-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
        .fs-avatar{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,0.3);border:3px solid rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:32px;color:#fff}
        .fs-body{flex:1;padding:20px;overflow-y:auto}
        .setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer}
        .setting-row:hover{color:var(--accent)}
        .setting-row .lbl{font-size:14px}.setting-row .val{color:var(--text2);font-size:13px}
        .toggle-switch{width:48px;height:26px;background:var(--border2);border-radius:13px;position:relative;cursor:pointer;transition:background 0.3s}
        .toggle-switch.active{background:var(--accent)}
        .toggle-switch::after{content:'';position:absolute;width:22px;height:22px;background:#fff;border-radius:50%;top:2px;left:2px;transition:transform 0.3s}
        .toggle-switch.active::after{transform:translateX(22px)}
        .unread-badge{background:var(--accent);color:#fff;border-radius:10px;padding:2px 7px;font-size:10px;font-weight:700;min-width:18px;text-align:center}
        .splash-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
        .splash-screen.hide{opacity:0;pointer-events:none}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}

        .auth-screen{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:400;flex-direction:column}
        .auth-screen.show{display:flex}
        .auth-header{height:220px;background:linear-gradient(135deg,var(--accent3),var(--accent));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
        .auth-body{flex:1;padding:24px 20px;display:flex;flex-direction:column;justify-content:center;max-width:400px;margin:0 auto;width:100%}
        .auth-input{width:100%;padding:12px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);font-size:15px;margin-bottom:12px}
        .auth-input:focus{border-color:var(--accent)}
        .auth-btn{width:100%;padding:13px;background:var(--accent);color:#fff;border-radius:var(--radius);font-weight:600;font-size:15px;margin-top:8px}
        .auth-btn-secondary{width:100%;padding:13px;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:var(--radius);font-weight:500;font-size:14px;margin-top:8px}
        .auth-switch{text-align:center;color:var(--text2);font-size:13px;margin-top:16px}
        .auth-switch span{color:var(--accent);cursor:pointer;font-weight:500}
        .auth-error{color:var(--accent);font-size:12px;text-align:center;margin-bottom:8px;display:none}

        @media(min-width:769px){.chats-screen{width:340px}}
        @media(max-width:768px){
            .header{height:48px;padding:0 10px}
            .back-btn{display:flex;width:30px;height:30px;font-size:14px}
            .app{height:calc(100vh - 48px)}
            .chats-screen{max-width:100%;width:100%;position:absolute;top:0;left:0}
            .chat-screen{width:100%;position:absolute;top:0;left:0;transform:translateX(100%);transition:transform .3s}
            .chat-screen.active{transform:translateX(0)}
            .chats-screen.hidden{transform:translateX(-30%);opacity:.3;pointer-events:none}
            .msg-bubble{max-width:78%}
        }
    </style>
</head>
<body>
    <div class="splash-screen" id="splashScreen">
        <img src="you_know.png" style="width:72px;height:72px;border-radius:18px;margin-bottom:16px">
        <div style="font-family:var(--head);font-size:24px;font-weight:700">TOUCH</div>
        <div style="color:var(--text3);font-size:13px;margin-top:4px">powered by Zmee</div>
        <div style="width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin-top:24px"></div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>

    <header class="header">
        <div class="header-left"><button class="back-btn" id="backBtn" onclick="goBack()">←</button><img src="you_know.png" style="width:26px;height:26px;border-radius:6px"><span class="logo-text">Touch</span></div>
        <div class="header-right"><button class="hbtn" onclick="openProfile()"><div class="ava-sm" id="headAva">?</div></button></div>
    </header>

    <div class="app">
        <div class="chats-screen" id="chatsScreen">
            <div class="search-wrap"><div class="search-box"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4" stroke="var(--text3)" stroke-width="1.5" fill="none"/><path d="M10.5 10.5L14 14" stroke="var(--text3)" stroke-width="1.5" stroke-linecap="round"/></svg><input type="text" placeholder="Поиск" id="searchInput"></div></div>
            <div class="chats-list" id="chatsList"></div>
        </div>
        <div class="chat-screen" id="chatScreen">
            <div class="chat-header">
                <div class="chat-header-info"><div class="ava-lg" id="chatAva">?</div><div><div class="chat-title" id="chatTitle" onclick="renameChat()">Выберите чат</div><div class="chat-status"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#4CAF50;margin-right:4px"></span>В сети</div></div></div>
                <div class="chat-actions">
                    <button class="hbtn" onclick="renameChat()" style="font-family:monospace">/</button>
                    <button class="hbtn" onclick="deleteChat()" style="color:var(--accent);font-family:monospace">x</button>
                </div>
            </div>
            <div class="messages" id="messages"><div class="messages-center">Выберите чат</div></div>
            <div class="input-area"><textarea id="msgInput" placeholder="Сообщение..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea><button class="btn-send" onclick="sendMsg()">&gt;</button></div>
        </div>
    </div>

    <div class="auth-screen" id="authScreen">
        <div class="auth-header"><div style="width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;margin-bottom:12px"><img src="you_know.png" style="width:48px;height:48px;border-radius:12px"></div><div style="color:#fff;font-family:var(--head);font-size:22px;font-weight:700">Touch</div><div class="auth-subtitle" id="authSubtitle">Войдите в аккаунт</div></div>
        <div class="auth-body"><div class="auth-error" id="authError"></div><input type="email" class="auth-input" id="authEmail" placeholder="Email"><input type="text" class="auth-input" id="authUsername" placeholder="Имя"><input type="password" class="auth-input" id="authPassword" placeholder="Пароль"><button class="auth-btn" id="authSubmitBtn">Войти</button><p class="auth-switch"><span id="authToggleBtn">Регистрация</span></p></div>
    </div>

    <div class="fullscreen" id="profileScreen">
        <div class="fs-header"><button class="fs-close" onclick="closeProfile()">&times;</button><div class="fs-avatar" id="profBigAva">U</div><div style="color:#fff;font-family:var(--head);font-size:20px;margin-top:10px" id="profBigName">Пользователь</div><div style="color:rgba(255,255,255,.7);font-size:13px" id="profBigTid">@touch_user</div></div>
        <div class="fs-body"><div class="setting-row" onclick="updateDisplayName()"><span class="lbl">Имя</span><span class="val" id="profDisplayName">-</span></div><div class="setting-row"><span class="lbl">Email</span><span class="val" id="profEmail">-</span></div><div class="setting-row" onclick="setPassword()"><span class="lbl">Пароль</span><span class="val" id="passwordStatus">Не установлен</span></div><div class="setting-row" onclick="copyTid()"><span class="lbl">TID</span><span class="val" id="profTid">-</span></div><div class="setting-row"><span class="lbl">Регистрация</span><span class="val" id="profDate">-</span></div><div class="setting-row" onclick="toggleTheme()"><span class="lbl">Тёмная тема</span><span class="val"><div class="toggle-switch" id="themeToggle"></div></span></div><button class="auth-btn-secondary" onclick="openLogoutScreen()" style="margin-top:20px">Выйти</button></div>
    </div>

    <div class="fullscreen" id="logoutScreen">
        <div class="fs-header" style="height:160px"><button class="fs-close" onclick="closeLogoutScreen()">&times;</button><div style="color:#fff;font-family:var(--head);font-size:22px">Выход</div></div>
        <div class="fs-body" style="text-align:center;padding-top:30px"><p style="color:var(--text2);margin-bottom:20px">Все данные будут очищены.</p><button class="auth-btn" onclick="confirmLogout()">Выйти</button><button class="auth-btn-secondary" onclick="closeLogoutScreen()" style="margin-top:8px">Отмена</button></div>
    </div>

    <script>
    const SUPABASE_URL = 'https://efsacictumespelzheaj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_10rKA_3PcyCW7l-HwSjz4w_w8NaA7ls';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let user=null,chatId=null,isLogin=true,pollTimer=null,chatsPollTimer=null,lastMsgCount=0,lastMessageDate=null;

    function hideSplash(){let s=document.getElementById('splashScreen');if(s){s.classList.add('hide');setTimeout(()=>s.remove(),400)}}
    const saved=localStorage.getItem('touchUser');
    if(saved){try{user=JSON.parse(saved);if(user&&user.id){hideAuth();refreshUI();loadChats();startChatsPolling();setTimeout(hideSplash,300)}}catch(e){localStorage.removeItem('touchUser');showAuth();setTimeout(hideSplash,1500)}}
    else{showAuth();setTimeout(hideSplash,1500)}
    if(localStorage.getItem('touchTheme')==='dark')document.body.classList.add('dark');

    function showAuth(){document.getElementById('authScreen').classList.add('show')}
    function hideAuth(){document.getElementById('authScreen').classList.remove('show')}
    function openProfile(){refreshUI();document.getElementById('profileScreen').classList.add('show')}
    function closeProfile(){document.getElementById('profileScreen').classList.remove('show')}
    function openLogoutScreen(){document.getElementById('logoutScreen').classList.add('show')}
    function closeLogoutScreen(){document.getElementById('logoutScreen').classList.remove('show')}

    function refreshUI(){
        if(!user)return;let n=user.display_name||user.username||'?';
        document.getElementById('headAva').textContent=n[0].toUpperCase();document.getElementById('profBigAva').textContent=n[0].toUpperCase();
        document.getElementById('profBigName').textContent=n;document.getElementById('profBigTid').textContent=user.tid||'@touch_user';
        document.getElementById('profDisplayName').textContent=n;document.getElementById('profEmail').textContent=user.email||'-';
        document.getElementById('profTid').textContent=user.tid||'-';document.getElementById('profDate').textContent=user.created_at?new Date(user.created_at).toLocaleDateString('ru-RU'):'-';
        document.getElementById('passwordStatus').textContent=user.password_hash?'Установлен':'Не установлен';
        document.getElementById('passwordStatus').style.color=user.password_hash?'#4CAF50':'var(--accent)';
        let t=document.getElementById('themeToggle');if(t){if(document.body.classList.contains('dark'))t.classList.add('active');else t.classList.remove('active')}
    }
    function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('touchTheme',document.body.classList.contains('dark')?'dark':'light');refreshUI()}

    async function setPassword(){
        if(!user)return;
        let np=prompt('Новый пароль (мин 8):','');
        if(!np||np.length<8){alert('Минимум 8 символов');return}
        let{error}=await db.rpc('set_password',{uid:user.id,pass:np});
        if(error){alert('Ошибка');return}
        user.password_hash='***';localStorage.setItem('touchUser',JSON.stringify(user));refreshUI();alert('OK')
    }

    async function doAuth(){
        let email=document.getElementById('authEmail').value.trim(),username=document.getElementById('authUsername').value.trim(),password=document.getElementById('authPassword').value.trim(),err=document.getElementById('authError');
        err.style.display='none';if(!email||!username||!password){err.textContent='Заполните все поля';err.style.display='block';return}
        if(password.length<8){err.textContent='Пароль минимум 8 символов';err.style.display='block';return}
        try{
            if(isLogin){
                let{data,error}=await db.from('users').select('id,email,username,display_name,tid,status,created_at').eq('email',email).eq('username',username).single();
                if(error||!data){err.textContent='Не найдено';err.style.display='block';return}
                let{data:ok}=await db.rpc('verify_password',{uid:data.id,pass:password});if(!ok){err.textContent='Неверный пароль';err.style.display='block';return}
                user=data;await db.from('users').update({status:'online',last_seen:new Date()}).eq('id',user.id);
            }else{
                let{data:ex}=await db.from('users').select('id').or(`email.eq.${email},username.eq.${username}`).maybeSingle();if(ex){err.textContent='Уже существует';err.style.display='block';return}
                let{data:nu,error}=await db.from('users').insert({email,username,display_name:username,status:'online'}).select('id,email,username,display_name,tid,status,created_at').single();if(error)throw error;
                await db.rpc('set_password',{uid:nu.id,pass:password});user=nu;
            }
            localStorage.setItem('touchUser',JSON.stringify(user));hideAuth();hideSplash();refreshUI();loadChats();startChatsPolling();
        }catch(e){err.textContent=e.message;err.style.display='block'}
    }
    document.getElementById('authSubmitBtn').addEventListener('click',doAuth);
    document.getElementById('authToggleBtn').addEventListener('click',function(){isLogin=!isLogin;document.getElementById('authSubtitle').textContent=isLogin?'Войдите':'Создайте аккаунт';document.getElementById('authSubmitBtn').textContent=isLogin?'Войти':'Зарегистрироваться';this.textContent=isLogin?'Регистрация':'Войти';document.getElementById('authError').style.display='none'});

    function startChatsPolling(){if(chatsPollTimer)clearInterval(chatsPollTimer);chatsPollTimer=setInterval(updateChats,2000)}
    async function updateChats(){if(!user)return;let{data}=await db.from('chat_members').select('chat_id,chats(id,name)').eq('user_id',user.id);if(!data)return;for(let item of data){let{data:count}=await db.rpc('get_unread_count',{chat_id:item.chats.id,user_id:user.id});let unread=count||0;let badge=document.getElementById('badge-'+item.chats.id);let last=document.getElementById('last-'+item.chats.id);let itemEl=document.querySelector('[data-chat-id="'+item.chats.id+'"]');if(badge){badge.textContent=unread;badge.style.display=unread>0?'inline-block':'none'}if(last){last.textContent=unread>0?unread+' новых':'';last.style.color=unread>0?'var(--accent)':'var(--text2)'}if(itemEl){if(unread>0)itemEl.classList.add('unread');else itemEl.classList.remove('unread')}}}
    async function loadChats(){if(!user)return;let{data}=await db.from('chat_members').select('chat_id,chats(id,name)').eq('user_id',user.id);let list=document.getElementById('chatsList');list.innerHTML='';if(data&&data.length){for(let item of data){let isActive=chatId===item.chats.id;let div=document.createElement('div');div.className='chat-item'+(isActive?' active':'');div.dataset.chatId=item.chats.id;div.addEventListener('click',()=>openChat(item.chats.id,item.chats.name));let ava=document.createElement('div');ava.className='ava';ava.textContent=(item.chats.name||'?')[0];let info=document.createElement('div');info.className='chat-info';let name=document.createElement('div');name.className='chat-name';name.textContent=item.chats.name;let last=document.createElement('div');last.className='chat-last';last.id='last-'+item.chats.id;info.appendChild(name);info.appendChild(last);let badge=document.createElement('div');badge.className='unread-badge';badge.id='badge-'+item.chats.id;badge.style.display='none';badge.textContent='0';div.appendChild(ava);div.appendChild(info);div.appendChild(badge);list.appendChild(div)}updateChats()}else{list.innerHTML='<div style="text-align:center;color:var(--text2);padding:30px">Нет чатов</div>'}hideSplash()}
    async function openChat(id,name){if(pollTimer)clearInterval(pollTimer);chatId=id;lastMsgCount=0;lastMessageDate=null;document.getElementById('chatTitle').textContent=name;document.getElementById('chatAva').textContent=name[0];await loadMessages();markAsRead(id);updateChats();pollTimer=setInterval(checkNewMessages,1000);if(window.innerWidth<=768){document.getElementById('chatScreen').classList.add('active');document.getElementById('chatsScreen').classList.add('hidden');document.getElementById('backBtn').style.display='flex'}}
    async function loadMessages(){if(!chatId)return;lastMessageDate=null;let{data:msgs}=await db.from('messages').select('*').eq('chat_id',chatId).order('created_at',{ascending:true});let c=document.getElementById('messages');c.innerHTML='';if(msgs&&msgs.length){lastMsgCount=msgs.length;for(let m of msgs)appendMessage(m,c)}else{let center=document.createElement('div');center.className='messages-center';center.textContent='Нет сообщений';c.appendChild(center)}c.scrollTop=c.scrollHeight}
    async function checkNewMessages(){if(!chatId)return;let{data:msgs}=await db.from('messages').select('*').eq('chat_id',chatId).order('created_at',{ascending:true});let c=document.getElementById('messages');let placeholder=c.querySelector('.messages-center');if(placeholder)placeholder.remove();let temps=c.querySelectorAll('.msg[data-msg-id^="temp_"]');temps.forEach(el=>el.remove());if(!msgs||msgs.length<=lastMsgCount)return;for(let i=lastMsgCount;i<msgs.length;i++)appendMessage(msgs[i],c);lastMsgCount=msgs.length;c.scrollTop=c.scrollHeight;markAsRead(chatId)}
    function getDateString(d){let n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate()),y=new Date(t);y.setDate(y.getDate()-1);let dd=new Date(d.getFullYear(),d.getMonth(),d.getDate());if(dd.getTime()===t.getTime())return'Сегодня';if(dd.getTime()===y.getTime())return'Вчера';return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:d.getFullYear()!==n.getFullYear()?'numeric':undefined})}
    function appendMessage(m,c,isTemp=false){let isOut=m.sender_id===user.id,isDel=m.is_deleted;let d=new Date(m.created_at),time=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});let ds=getDateString(d);if(ds!==lastMessageDate){lastMessageDate=ds;let sep=document.createElement('div');sep.className='msg-date-separator';let span=document.createElement('span');span.textContent=ds;sep.appendChild(span);c.appendChild(sep)}let div=document.createElement('div');div.className='msg '+(isOut?'out':'in');div.dataset.msgId=m.id;div.dataset.senderId=m.sender_id;let bubble=document.createElement('div');bubble.className='msg-bubble'+(isDel?' deleted':'');let p=document.createElement('p');p.textContent=isDel?'[x] Удалено':m.content;let timeSpan=document.createElement('div');timeSpan.className='time';timeSpan.textContent=time;bubble.appendChild(p);bubble.appendChild(timeSpan);div.appendChild(bubble);if(!isTemp&&!isDel&&m.sender_id===user.id){div.addEventListener('contextmenu',e=>{e.preventDefault();showMsgMenu(e.clientX,e.clientY,m.id)});let lp;div.addEventListener('touchstart',e=>{lp=setTimeout(()=>showMsgMenu(e.touches[0].clientX,e.touches[0].clientY,m.id),500)});div.addEventListener('touchend',()=>clearTimeout(lp));div.addEventListener('touchmove',()=>clearTimeout(lp))}c.appendChild(div)}
    function showMsgMenu(x,y,id){closeMsgMenu();let m=document.createElement('div');m.id='msgMenu';m.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:4px 0;z-index:500;min-width:140px;box-shadow:0 4px 16px rgba(0,0,0,.1)';let delBtn=document.createElement('button');delBtn.textContent='[x] Удалить';delBtn.style.cssText='width:100%;padding:8px 14px;font-size:13px;color:var(--accent)';delBtn.addEventListener('click',()=>deleteMessage(id));let cancelBtn=document.createElement('button');cancelBtn.textContent='[-] Отмена';cancelBtn.style.cssText='width:100%;padding:8px 14px;font-size:12px;color:var(--text2)';cancelBtn.addEventListener('click',closeMsgMenu);m.appendChild(delBtn);m.appendChild(cancelBtn);document.body.appendChild(m);setTimeout(()=>{document.addEventListener('click',closeMsgMenu);document.addEventListener('touchstart',closeMsgMenu)},100)}
    function closeMsgMenu(){let m=document.getElementById('msgMenu');if(m)m.remove();document.removeEventListener('click',closeMsgMenu);document.removeEventListener('touchstart',closeMsgMenu)}
    async function deleteMessage(id){closeMsgMenu();if(!confirm('Удалить?'))return;await db.from('messages').update({is_deleted:true,content:'[x] Удалено'}).eq('id',id);let el=document.querySelector('[data-msg-id="'+id+'"]');if(el){el.querySelector('.msg-bubble').classList.add('deleted');el.querySelector('p').textContent='[x] Удалено'}}
    async function markAsRead(cid){if(!user||!cid)return;let{data:ur}=await db.from('messages').select('id').eq('chat_id',cid).neq('sender_id',user.id);if(!ur||!ur.length)return;await db.from('message_reads').upsert(ur.map(m=>({message_id:m.id,user_id:user.id,read_at:new Date().toISOString()})),{onConflict:'message_id,user_id',ignoreDuplicates:true})}
    async function sendMsg(){if(!chatId)return;let ta=document.getElementById('msgInput');let t=ta.value.trim();if(!t)return;ta.value='';ta.style.height='auto';let tmp={id:'temp_'+Date.now(),content:t,sender_id:user.id,created_at:new Date().toISOString(),is_deleted:false,sending:true};let c=document.getElementById('messages');let placeholder=c.querySelector('.messages-center');if(placeholder)placeholder.remove();appendMessage(tmp,c,true);c.scrollTop=c.scrollHeight;let{error}=await db.from('messages').insert({chat_id:chatId,sender_id:user.id,content:t});if(error){let el=document.querySelector('[data-msg-id="'+tmp.id+'"]');if(el){el.querySelector('.msg-bubble').style.opacity='0.5';el.querySelector('p').textContent='[x] Ошибка'}}else{await checkNewMessages()}}
    async function updateDisplayName(){let nm=prompt('Новое имя:',user.display_name||user.username);if(!nm)return;await db.from('users').update({display_name:nm}).eq('id',user.id);user.display_name=nm;localStorage.setItem('touchUser',JSON.stringify(user));refreshUI()}
    async function renameChat(){if(!chatId)return;let nm=prompt('Название:',document.getElementById('chatTitle').textContent);if(!nm)return;await db.from('chats').update({name:nm}).eq('id',chatId);document.getElementById('chatTitle').textContent=nm;document.getElementById('chatAva').textContent=nm[0];loadChats()}
    async function deleteChat(){if(!chatId)return;if(!confirm('Удалить чат для себя?'))return;await db.from('chat_members').delete().eq('chat_id',chatId).eq('user_id',user.id);if(pollTimer){clearInterval(pollTimer);pollTimer=null}chatId=null;document.getElementById('chatTitle').textContent='Выберите чат';document.getElementById('chatAva').textContent='?';document.getElementById('messages').innerHTML='<div class="messages-center">Чат удалён</div>';loadChats();if(window.innerWidth<=768)goBack()}
    function goBack(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}chatId=null;lastMsgCount=0;document.getElementById('chatScreen').classList.remove('active');document.getElementById('chatsScreen').classList.remove('hidden');document.getElementById('backBtn').style.display='none';document.getElementById('chatTitle').textContent='Выберите чат';document.getElementById('chatAva').textContent='?';let mc=document.getElementById('messages');mc.innerHTML='';let center=document.createElement('div');center.className='messages-center';center.textContent='Выберите чат';mc.appendChild(center)}
    function copyTid(){navigator.clipboard.writeText(document.getElementById('profTid').textContent);alert('Скопировано!')}
    function confirmLogout(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}if(chatsPollTimer){clearInterval(chatsPollTimer);chatsPollTimer=null}if(user)db.from('users').update({status:'offline',last_seen:new Date()}).eq('id',user.id);localStorage.removeItem('touchUser');user=null;chatId=null;closeProfile();closeLogoutScreen();goBack();document.getElementById('chatsList').innerHTML='<div style="text-align:center;color:var(--text2);padding:30px">Нет чатов</div>';document.getElementById('headAva').textContent='?';showAuth()}

    document.addEventListener('DOMContentLoaded',()=>{let ta=document.getElementById('msgInput');if(ta)ta.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'})});
    </script>
</body>
</html>
